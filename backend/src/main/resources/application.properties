spring.application.name=gestao-faisca
server.port=8080

#Lembrar de alterar para variaveis de ambiente
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestao_faisca?serverTimezone=America/Sao_Paulo&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
